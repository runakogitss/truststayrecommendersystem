    aliases: [staff, employee, employees, personnel, host, hosts]
  - canonical: service
    aliases: [service, services]
  - canonical: location
    aliases: [location, located, area, neighborhood, neighbourhood]
  - canonical: food
    aliases: [food, meal, meals, dinner, lunch, restaurant, restaurants]
  - canonical: breakfast
    aliases: [breakfast]
  - canonical: cleanliness
    aliases: [clean, cleaner, cleanliness, dirty, dirt]
  - canonical: value
    aliases: [value, price, prices, expensive, cheap, cost]
  - canonical: noise
    aliases: [noise, noisy, quiet, quieter, sound, sounds]
  - canonical: bathroom
    aliases: [bathroom, bathrooms, toilet, toilets, shower, showers]
  - canonical: bed
    aliases: [bed, beds, mattress, mattresses, pillow, pillows]
  - canonical: wifi
    aliases: [wifi, wi-fi, internet, broadband]
  - canonical: parking
    aliases: [parking, carpark, car park, garage]
  - canonical: pool
    aliases: [pool, pools, swimming]
  - canonical: spa
    aliases: [spa, sauna, massage]
